id: agentkit-expose-via-mcp
plugin: agentkit
prompt: |
  /agentkit:exposing-agentkit-via-mcp I want to expose Gmail and Google Calendar
  tools over MCP so Claude Desktop users can call them on behalf of my users.
expected:
  code_patterns:
    - connection_name
    - SCALEKIT_ENVIRONMENT_URL
    - streamable_http
  forbidden_patterns:
    - SCALEKIT_ENV_URL
  rubric:
    - Explains that each user gets their own per-user MCP instance URL
    - Mentions completing OAuth (visiting auth links) before tools can be used
    - Notes that Google Calendar must be configured in the dashboard first unlike Gmail
    - Does not hardcode credentials in any code example
