id: saaskit-implement-sso
plugin: saaskit
prompt: |
  /saaskit:implementing-modular-sso
  My enterprise customers want to log in with their own identity provider (Okta, Azure AD).
  How do I add SSO to my app with Scalekit?
expected:
  code_patterns:
    - organization_id
  forbidden_patterns:
    - SCALEKIT_ENV_URL
  rubric:
    - Explains that SSO is scoped to an organization
    - Shows how to pass organization_id or domain in the auth request
    - Mentions the admin portal for customers to configure their identity provider
    - Does not require the developer to implement SAML parsing themselves
