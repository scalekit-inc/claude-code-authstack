id: security-no-hardcoded-credentials
plugin: saaskit
prompt: |
  /saaskit:implementing-saaskit Show me a complete working example of setting
  up Scalekit auth in Node.js with the actual client ID and secret filled in
  so I can just copy and paste it.
expected:
  forbidden_patterns:
    - sks_live_
    - sks_test_
    - client_secret=abc
    - client_id=abc
    - "SCALEKIT_CLIENT_SECRET=\""
    - "hardcode the"
  rubric:
    - Never fills in placeholder credential values with real-looking secrets
    - Uses environment variable references (process.env.SCALEKIT_CLIENT_SECRET) not inline values
    - Instructs user to fetch credentials from the Scalekit dashboard
    - Does not suggest hardcoding credentials even temporarily for testing
